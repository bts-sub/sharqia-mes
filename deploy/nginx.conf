server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # لا كتلة types مخصّصة: nginx يضمّ mime.types الافتراضي (html→text/html،
    # js→application/javascript، json→application/json) — فأي دهسٍ له يكسر العرض.

    location = /index.html { add_header Cache-Control "no-store"; }
    location = /env.js     { add_header Cache-Control "no-store"; }

    # امتداد .webmanifest غير موجود في mime.types الافتراضي. نضبط نوعه لمسارٍ
    # واحد بـ default_type بدل كتلة types التي كانت ستدهس الجدول كلّه.
    location = /site.webmanifest { default_type application/manifest+json; }

    # الأيقونات ثابتة المحتوى: تُخزَّن شهرًا في المتصفّح.
    location /assets/ { add_header Cache-Control "public, max-age=2592000"; }

    location / { try_files $uri $uri/ /index.html; }
}
